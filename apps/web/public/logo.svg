<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14261f" />
      <stop offset="50%" stop-color="#0a1212" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00d26a" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ffd700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>

    <!-- Emerald Pillar Gradient -->
    <linearGradient id="emeraldPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e584" />
      <stop offset="45%" stop-color="#00d26a" />
      <stop offset="100%" stop-color="#056b40" />
    </linearGradient>

    <!-- Specular Highlight for Pillars -->
    <linearGradient id="pillarHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Radiant Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8" />
      <stop offset="25%" stop-color="#ffd700" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for 3D Depth -->
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#00d26a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Squircle App Badge Container -->
  <rect x="12" y="12" width="488" height="488" rx="124" ry="124" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="124" ry="124" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- 2. Subtle Background Security / Holographic Rings -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#00d26a" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="6 14" />

  <!-- 3. Central Emblem Shadow Group -->
  <g filter="url(#shadow3D)">
    
    <!-- Provably Fair Verification Arc (Circling the letter H) -->
    <path d="M 124 330 A 160 160 0 1 1 388 330" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85" filter="url(#neonGlow)" />
    
    <!-- Connecting Golden Ticket Ribbon / Crossbar Base -->
    <g>
      <!-- Ticket Crossbar Body -->
      <path d="M 170 224 L 342 224 C 362 224 362 288 342 288 L 170 288 C 150 288 150 224 170 224 Z" fill="url(#goldGrad)" />
      
      <!-- Inner Ticket Cutout Stitching -->
      <path d="M 186 238 L 326 238 M 186 274 L 326 274" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
      
      <!-- Ticket Side Notches -->
      <circle cx="160" cy="256" r="14" fill="#070c0c" />
      <circle cx="352" cy="256" r="14" fill="#070c0c" />
    </g>

    <!-- 4. Left Emerald Pillar of "H" -->
    <rect x="136" y="104" width="58" height="304" rx="29" fill="url(#emeraldPillar)" />
    <rect x="136" y="104" width="58" height="304" rx="29" fill="url(#pillarHighlight)" />

    <!-- 5. Right Emerald Pillar of "H" -->
    <rect x="318" y="104" width="58" height="304" rx="29" fill="url(#emeraldPillar)" />
    <rect x="318" y="104" width="58" height="304" rx="29" fill="url(#pillarHighlight)" />

    <!-- 6. Golden Lucky Star / Diamond in Crossbar Center -->
    <g transform="translate(256, 256)" filter="url(#intenseGlow)">
      <!-- 4-point Diamond Star -->
      <path d="M 0 -34 Q 0 0 34 0 Q 0 0 0 34 Q 0 0 -34 0 Q 0 0 0 -34 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="10" fill="url(#goldGrad)" />
      <!-- Star Ray Accents -->
      <circle cx="-16" cy="0" r="2.5" fill="#ffffff" />
      <circle cx="16" cy="0" r="2.5" fill="#ffffff" />
      <circle cx="0" cy="-16" r="2.5" fill="#ffffff" />
      <circle cx="0" cy="16" r="2.5" fill="#ffffff" />
    </g>

    <!-- 7. Crown Lucky Star (Floating on Top of the Logo) -->
    <g transform="translate(256, 92)" filter="url(#intenseGlow)">
      <!-- 5-Point Crown Star -->
      <path d="M 0 -22 L 6.5 -6.5 L 23 -4.5 L 10.5 6.5 L 14.5 22.5 L 0 13.5 L -14.5 22.5 L -10.5 6.5 L -23 -4.5 L -6.5 -6.5 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="-2" r="4.5" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- 8. Subtle Glass Specular Glint on Top Corner -->
  <path d="M 12 136 C 12 68 68 12 136 12 L 376 12 C 444 12 500 68 500 136 C 360 170 150 200 12 136 Z" fill="#ffffff" opacity="0.04" />
</svg>
